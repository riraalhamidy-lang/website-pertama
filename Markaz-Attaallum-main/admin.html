<!-- KUNCI PORTAL (LOGIN) -->
<div class="modal-box" id="login-gate">
    <i class="fa-solid fa-user-shield"></i>
    <h3>Portal Admin Markaz</h3>
    <p>Silakan masukkan PIN otorisasi untuk mengakses database santri.</p>
    
    <div class="form-group">
        <input type="password" id="pinAdmin" placeholder="Masukkan PIN Master">
    </div>
    <button class="btn-glow" onclick="cekKunci()">LOGIN KE SISTEM <i class="fa-solid fa-arrow-right"></i></button>
</div>

<!-- PANEL DATABASE (HASIL CARI) -->
<div class="modal-box" id="admin-panel" style="display: none;">
    <i class="fa-solid fa-server"></i>
    <h3>Database Terpadu</h3>
    <p>Cari dokumen pendaftaran santri langsung dari server pusat.</p>
    
    <!-- Class search-wrapper ini ditambahkan dari CSS -->
    <div class="search-wrapper">
        <input type="text" id="searchKeyword" placeholder="Ketik NIA atau Nama...">
        <button class="btn-glow" id="btnCari" onclick="cariData()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div class="ticket-wrapper" id="boxHasil">
        <div class="ticket-header" id="txtSumberTab">DATABASE FOUND</div>
        <div id="areaDaftarData"></div>
    </div>
</div>
