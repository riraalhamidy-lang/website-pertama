<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Absen | Markaz At-Ta'allum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Panggil warna global dulu -->
    <link rel="stylesheet" href="css/umum.css">

    <!-- BARIS INI YANG MENYAMBUNGKAN HTML KE FILE CSS -->
    <link rel="stylesheet" href="css/absen.css">
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <div class="scanner-card">
        <h1>Scan QR <span>Absensi</span></h1>
        <p class="subtitle">Arahkan kamera HP lu tepat ke QR Code ID Card Murid untuk mencatat kehadiran.</p>

        <div class="preview-wrapper" id="boxWrapper">
            <div class="placeholder-box" id="placeholder">
                <i class="fa-solid fa-qrcode"></i>
                <p>Kamera belum aktif bray</p>
            </div>
            <div id="reader"></div>
        </div>

        <button class="btn-action" id="actionBtn">
            <i class="fa-solid fa-camera"></i> Aktifkan Kamera Scanner
        </button>
    </div>

    <!-- BARIS INI YANG MENYAMBUNGKAN HTML KE FILE JS -->
    <script src="js/absen.js"></script>
    <!-- 1. Panggil Pusat Kendali Dulu -->
    <script src="js/config.js"></script>
    
    <!-- 2. Baru panggil logika halamannya -->
    <script src="js/admin.js"></script>
</body>
</html>
